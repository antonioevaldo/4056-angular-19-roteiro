<aside class="extrato">
  <h2 class="titulo">Extrato</h2>

  <ul class="transacoes">
    @for (transacao of transacoes(); track $index) {
      <li>
        <app-transacao [transacao]="transacao" />
      </li>
    } @empty {
      <li aria-hidden="true">
        Ainda não há transações.
      </li>
    }
  </ul>
</aside>
